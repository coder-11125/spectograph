[package]
name = "spectograph-cli"
description = "Spectograph command-line interface: check and fix subcommands."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "spectograph"
path = "src/main.rs"

[dependencies]
spectograph-core.workspace = true
spectograph-analyzer.workspace = true
spectograph-py.workspace = true
spectograph-js.workspace = true
spectograph-ts.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
