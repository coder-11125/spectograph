[workspace]
resolver = "2"
members = [
    "spectograph-core",
    "spectograph-analyzer",
    "spectograph-cli",
    "spectograph-py",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/1jehuang/spectograph"
authors = ["spectograph contributors"]

[workspace.dependencies]
spectograph-core = { path = "spectograph-core", version = "0.1.0" }
spectograph-analyzer = { path = "spectograph-analyzer", version = "0.1.0" }
spectograph-py = { path = "spectograph-py", version = "0.1.0" }

# IR / graph
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
