[workspace]
resolver = "2"
members = [
    "spectograph-core",
    "spectograph-analyzer",
    "spectograph-cli",
    "spectograph-py",
    "spectograph-js",
    "spectograph-ts",
    "spectograph-tsserver",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/coder-11125/spectograph"
authors = ["spectograph contributors"]

[workspace.dependencies]
spectograph-core = { path = "spectograph-core", version = "0.1.0" }
spectograph-analyzer = { path = "spectograph-analyzer", version = "0.1.0" }
spectograph-py = { path = "spectograph-py", version = "0.1.0" }
spectograph-js = { path = "spectograph-js", version = "0.1.0" }
spectograph-ts = { path = "spectograph-ts", version = "0.1.0" }
spectograph-tsserver = { path = "spectograph-tsserver", version = "0.1.0" }

# IR / graph
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
